name: Sync Notion scores
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    branches: [main]
    paths: ['scripts/sync-notion.mjs', '.github/workflows/sync-scores.yml']
permissions:
  contents: write
concurrency:
  group: notion-score-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Notion connection
        id: connection
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sync is waiting for the NOTION_TOKEN repository secret."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read scores from Notion
        if: steps.connection.outputs.ready == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs
      - name: Publish score data
        if: steps.connection.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scores.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync tournament scores from Notion'
            git push origin HEAD:main
          fi
